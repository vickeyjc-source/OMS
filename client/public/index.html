<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b4f9e" />
    <title>Ciflux OMS</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f0ede8; }
      #root {
        width: 111.11vw;
        height: 100vh;
        transform: scaleX(0.9);
        transform-origin: top left;
        overflow: hidden;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
